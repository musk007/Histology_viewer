<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
</head>

<body style="margin:0;">
    <div id="viewer" style="width:100%; height:750px;"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
    
        const caseName = params.get("case");
        const view = params.get("view");
        const maskName = params.get("mask");
    
        const baseUrl =
            "https://storage.googleapis.com/histology-viewer-tiles-roba/static";
    
        let tileSource;
    
        if (view === "mask") {
            tileSource =
                `${baseUrl}/${caseName}/${maskName}_dzi.xml`;
        } else if (view === "overlay") {
            tileSource =
                `${baseUrl}/${caseName}/overlay_${maskName}_dzi.xml`;
        } else {
            tileSource =
                `${baseUrl}/${caseName}/image_dzi.xml`;
        }
    
        const viewer = OpenSeadragon({
            id: "viewer",
            prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/",
            tileSources: tileSource,
            showNavigator: true,
            showHomeControl: true,
            gestureSettingsMouse: {
                clickToZoom: true,
                dblClickToZoom: true,
                dragToPan: true,
                scrollToZoom: true
            }
        });
    </script>
</body>
</html>
